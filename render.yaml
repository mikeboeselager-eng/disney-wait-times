services:
  - type: web
    name: disney-wait-times
    runtime: static
    buildCommand: ""
    publishPath: "."
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
